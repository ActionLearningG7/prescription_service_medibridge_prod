spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:prod-db}:${DB_PORT:3306}/${DB_NAME:medibridge_prescription_prod}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:produser}
    password: ${DB_PASSWORD:***CONFIGURE_ME***}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000

  # Redis Configuration
  data:
    redis:
      url: ${REDIS_URL:redis://prod-redis:6379}

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-prod:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${spring.application.name}-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

pdf:
  output-path: ${PDF_OUTPUT_PATH:/var/medibridge/prescriptions}
  font-path: ${PDF_FONT_PATH:/usr/share/fonts}

logging:
  level:
    root: ${LOG_LEVEL:WARN}
    com.medibridge: ${LOG_LEVEL_MEDIBRIDGE:INFO}
  file:
    name: ${LOG_FILE_PATH:/var/log/medibridge/prescription-service.log}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_PROTOCOL:https}://${EUREKA_HOST:eureka-prod}:${EUREKA_PORT:443}/eureka/
    register-with-eureka: true
    fetch-registry: true
