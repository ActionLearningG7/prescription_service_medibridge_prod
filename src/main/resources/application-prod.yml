spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://prod-db-server:3306/medibridge_prescription_prod?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000

  # Redis Configuration
  data:
    redis:
      url: ${REDIS_URL:redis://default:GOwUPRpFGRVtZMSiEEWlTapCvefmpsFj@hopper.proxy.rlwy.net:11415}

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:shortline.proxy.rlwy.net:57987}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${spring.application.name}-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

pdf:
  output-path: ${PDF_OUTPUT_PATH:/var/medibridge/prescriptions}
  font-path: ${PDF_FONT_PATH:/usr/share/fonts}

logging:
  level:
    root: WARN
    com.medibridge: INFO
  file:
    name: /var/log/medibridge/prescription-service.log
eureka:
  client:
    service-url:
      defaultZone: https://servermedibridgeprod-production.up.railway.app/eureka/
    register-with-eureka: true
    fetch-registry: true
