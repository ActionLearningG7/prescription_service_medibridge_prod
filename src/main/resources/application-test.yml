spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:test-db-server}:3306/medibridge_prescription_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:test_user}
    password: ${DB_PASSWORD:test_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

pdf:
  output-path: ${PDF_OUTPUT_PATH:/tmp/prescriptions}
  font-path: ${PDF_FONT_PATH:/usr/share/fonts}

logging:
  level:
    root: INFO
